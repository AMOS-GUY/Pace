name: UI preview

# Screenshots of the real app (Release build, iOS simulator), on request only. Runs on pushes to
# preview/** branches or manually. It changes nothing in the app; the output is a CI artifact
# and a new `ui-preview-run-<id>` branch per run (never main).
#
# The build's Supabase URL points at a local stand-in (scripts/ui-preview/auth-stub.mjs, test
# account only), so Maestro signs in through the real sign-in screen. The access-control flows
# use hard assertions and fail the job if a protected screen opens when it must not.
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Build, launch and capture every reachable screen
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      APP_BUNDLE_ID: app.pace.ios
      MAESTRO_VERSION: cli-2.12.0
      MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
      # Not secrets: the local auth stand-in on the runner, and a placeholder key.
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ui-preview-placeholder-publishable-key
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --no-install
          # The stand-in is plain http on 127.0.0.1; show what App Transport Security allows.
          plutil -p ios/*/Info.plist | grep -A4 NSAppTransportSecurity || true
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build Release app for simulator
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          set +e
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=             build > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          status=$?
          set -e
          [ "$status" -eq 0 ] || { tail -n 200 "$RUNNER_TEMP/xcodebuild.log"; exit "$status"; }
          # Ad-hoc signed (no Apple account): an unsigned build has no Keychain entitlement, and the
          # app's encrypted session store keeps its key in the Keychain.
          mkdir -p "$GITHUB_WORKSPACE/artifacts/ui-preview"
          codesign -d --entitlements - "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/PACE.app"             > "$GITHUB_WORKSPACE/artifacts/ui-preview/signing.txt" 2>&1 || true
          cat "$GITHUB_WORKSPACE/artifacts/ui-preview/signing.txt"
      - name: Boot a simulator and install the app
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = [(r, x) for r, xs in d.items() if ".iOS-" in r for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t: [int(p) for p in t[0].rsplit(".iOS-", 1)[1].split("-")])
          print(c[-1][1]["udid"])
          print(c[-1][1]["name"], c[-1][0], file=sys.stderr)
          ')"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/PACE.app"
      - name: Install Maestro (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          echo "$RUNNER_TEMP/maestro-dist/maestro/bin" >> "$GITHUB_PATH"
      - name: Start the local auth stand-in
        run: |
          nohup node scripts/ui-preview/auth-stub.mjs 54321 > "$RUNNER_TEMP/auth-stub.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null -X POST http://127.0.0.1:54321/auth/v1/logout && break
            sleep 1
          done
      - name: Access-control checks (hard assertions)
        id: access
        continue-on-error: true
        run: |
          status=0
          for flow in access-signed-out access-onboarding; do
            mkdir -p "artifacts/ui-preview/maestro/$flow"
            ( cd "artifacts/ui-preview/maestro/$flow" &&
              maestro test --format junit --output junit.xml --test-output-dir .                 "$GITHUB_WORKSPACE/apps/mobile/maestro/ui-preview/$flow.yaml" > maestro-stdout.log 2>&1 ) || status=1
            # Readable without signing in to GitHub: the end of each failed flow's output.
            [ $status -eq 0 ] || echo "::warning title=$flow::$(tail -n 12 "artifacts/ui-preview/maestro/$flow/maestro-stdout.log" | tr '\n' ' ' | cut -c1-900)"
          done
          exit $status
      - name: Walk the app and take screenshots
        continue-on-error: true
        run: |
          mkdir -p artifacts/ui-preview/maestro/walk
          cd artifacts/ui-preview/maestro/walk
          maestro test --format junit --output junit.xml --test-output-dir .             "$GITHUB_WORKSPACE/apps/mobile/maestro/ui-preview/ui-preview.yaml" > maestro-stdout.log 2>&1
      - name: Collect screenshots and build the contact sheet
        if: always()
        run: |
          mkdir -p artifacts/ui-preview/screens
          find artifacts/ui-preview/maestro "$GITHUB_WORKSPACE/apps/mobile/maestro" \( -name '[0-9][0-9]*-*.png' -o -name 'ac-*.png' \) \
            -exec cp {} artifacts/ui-preview/screens/ \; 2>/dev/null || true
          ls artifacts/ui-preview/screens > artifacts/ui-preview/screens.txt || true
          # Maestro's own output (JUnit report, logs, failure screenshots), for diagnosis.
          mkdir -p artifacts/ui-preview/debug
          for d in artifacts/ui-preview/maestro/*/; do
            n="$(basename "$d")"; mkdir -p "artifacts/ui-preview/debug/$n"
            find "$d" -type f \( -name '*.xml' -o -name '*.log' -o -name '*.json' -o -name 'step-*.png' \)               -exec cp {} "artifacts/ui-preview/debug/$n/" \; 2>/dev/null || true
          done
          cp "$RUNNER_TEMP/auth-stub.log" artifacts/ui-preview/debug/ 2>/dev/null || true
          # The simulator log is too large to publish: keep only the app's own lines.
          find artifacts/ui-preview/debug -name device-simulator.log -exec sh -c             'grep "PACE\[" "$1" | grep -v -e XCTAutomationSupport -e com.apple.dt.xctest | grep -i -E "com.facebook.react|javascript|ReactNative|RCT|exception|fatal|crash|error" | tail -n 3000 > "${1%.log}-app.log"; rm -f "$1"' _ {} \; || true
          echo "access-control checks: ${{ steps.access.outcome }}" > artifacts/ui-preview/access-control.txt
          latest="$(ls -dt "$HOME"/.maestro/tests/*/ 2>/dev/null | head -n 1)"
          [ -n "$latest" ] && cp -R "$latest" artifacts/ui-preview/debug/maestro-tests || true
          # The runner's Python is externally managed, so Pillow goes into a throwaway venv.
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow || true
          "$RUNNER_TEMP/venv/bin/python" scripts/ui-preview/contact_sheet.py artifacts/ui-preview/screens artifacts/ui-preview/contact-sheet.png || true
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "xcode: $(xcodebuild -version | head -n 1)"
            echo "simulator udid: $UDID"
          } > artifacts/ui-preview/run.txt || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: artifacts/ui-preview
          if-no-files-found: warn
      - name: Publish screenshots to a ui-preview-run-* branch (never main)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A new single-commit branch per run, so nothing is ever force-pushed or rewritten.
          # Any failure is reported as an annotation (readable without signing in).
          branch="ui-preview-run-$GITHUB_RUN_ID"
          out="$RUNNER_TEMP/publish"
          log="$RUNNER_TEMP/publish.log"
          mkdir -p "$out/ui-preview"
          cp -R artifacts/ui-preview/screens artifacts/ui-preview/debug "$out/ui-preview/" 2>/dev/null || true
          cp artifacts/ui-preview/README.md artifacts/ui-preview/access-control.txt artifacts/ui-preview/signing.txt artifacts/ui-preview/run.txt artifacts/ui-preview/screens.txt artifacts/ui-preview/contact-sheet.png \
            "$out/ui-preview/" 2>/dev/null || true
          # GitHub refuses files over 100 MB; drop anything over 40 MB and say so.
          find "$out" -type f -size +40M -print -delete | sed 's/^/dropped (too large): /' >> "$out/ui-preview/screens.txt" || true
          du -sh "$out/ui-preview" || true
          if ! {
            git -C "$out" init --quiet -b "$branch" &&
            git -C "$out" config user.name "github-actions[bot]" &&
            git -C "$out" config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
            git -C "$out" add -A &&
            git -C "$out" commit --quiet -m "UI preview of $GITHUB_SHA (run $GITHUB_RUN_ID)" &&
            git -C "$out" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          } > "$log" 2>&1; then
            echo "::error title=Publish failed::$(tail -n 15 "$log" | sed "s/${GH_TOKEN}/***/g" | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=Published::$branch"
      - name: Fail if an access-control check failed
        if: steps.access.outcome == 'failure'
        run: |
          echo "::error title=Access control::An access-control flow failed: a protected screen opened, or the flow could not finish (see debug/access-* and the warnings above)."
          exit 1
