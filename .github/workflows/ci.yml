name: CI

on:
  push:
    # ci/** branches let native CI changes be verified before they reach main.
    branches: [main, 'ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build
      - name: Typecheck API and mobile
        run: |
          pnpm --filter @pace/api typecheck
          pnpm --filter @pace/mobile typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit and integration tests (packages, mobile logic)
        run: pnpm test:unit --ci
      - name: API end-to-end tests (PGlite)
        run: pnpm test:api
      - name: Bundle iOS JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/pace-bundle

  ios-native:
    name: iOS native tests and build (simulator)
    # Expo SDK 58 builds ExpoModulesJSI from a Swift package that needs swift-tools-version 6.2
    # (Xcode 26+). macos-15 defaults to Xcode 16.4 (Swift 6.1), which cannot build it.
    runs-on: macos-26
    timeout-minutes: 75
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    defaults:
      run:
        # Explicit bash runs with `-eo pipefail`.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun swift --version
      - name: Swift unit tests (recorder core, journal, serialisation)
        working-directory: apps/mobile/modules/pace-tracking/ios
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check Swift toolchain against package requirements
        run: scripts/ci/check-swift-toolchain.sh .
      - run: pnpm build
      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Verify the native tracking module is autolinked
        working-directory: apps/mobile/ios
        run: |
          grep -q "PaceTracking" Podfile.lock || { echo "PaceTracking pod is not linked"; exit 1; }
      - name: Build app for simulator
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building $WORKSPACE / $SCHEME with $(xcodebuild -version | head -n 1)"
          # The full log is kept (uploaded below); nothing is piped, so the exit code is xcodebuild's own.
          set +e
          args=(-workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator)
          args+=(-destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build)
          xcodebuild "${args[@]}" > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          status=$?
          set -e
          echo "xcodebuild exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo "::group::Error lines"
            grep -nE "(error|fatal error):|BUILD FAILED|failed with exit code" "$RUNNER_TEMP/xcodebuild.log" || true
            echo "::endgroup::"
            echo "::group::Last 300 lines"
            tail -n 300 "$RUNNER_TEMP/xcodebuild.log"
            echo "::endgroup::"
          fi
          exit "$status"
      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
