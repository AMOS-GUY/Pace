name: CI

# Linux checks only: they run on pushes to main and ci/** and on every pull request. The macOS (iOS) jobs live in
# ios.yml, which runs only when native code changes or when started manually, because macOS
# runner minutes are billed at 10x on private repositories.
on:
  push:
    # ci/** branches let native CI changes be verified before they reach main.
    branches: [main, 'ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build
      - name: Typecheck API and mobile
        run: |
          pnpm --filter @pace/api typecheck
          pnpm --filter @pace/mobile typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit and integration tests (packages, mobile logic)
        run: pnpm test:unit --ci
      - name: API end-to-end tests (PGlite)
        run: pnpm test:api
      - name: Bundle iOS JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/pace-bundle
