name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build
      - name: Typecheck API and mobile
        run: |
          pnpm --filter @pace/api typecheck
          pnpm --filter @pace/mobile typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit and integration tests (packages, mobile logic)
        run: pnpm test:unit --ci
      - name: API end-to-end tests (PGlite)
        run: pnpm test:api
      - name: Bundle iOS JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/pace-bundle

  ios-native:
    name: iOS native tests and build (simulator)
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        # Explicit bash enables `-eo pipefail`, so a failing command piped into `tail` fails the
        # step. (The default shell omits pipefail, which previously hid xcodebuild failures.)
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Swift unit tests (recorder core, journal, serialisation)
        working-directory: apps/mobile/modules/pace-tracking/ios
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Verify the native tracking module is autolinked
        working-directory: apps/mobile/ios
        run: |
          grep -q "PaceTracking" Podfile.lock || { echo "PaceTracking pod is not linked"; exit 1; }
      - name: Build app for simulator
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building $WORKSPACE / $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -n 80
