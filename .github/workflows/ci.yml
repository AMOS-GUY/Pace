name: CI

# Linux checks only: they run on every push and every pull request, and do not depend on any
# macOS job. The macOS (iOS) jobs live in ios.yml, which runs only when native code changes or
# when started manually, because macOS minutes count 10x against the included Actions minutes.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build
      - name: Typecheck API and mobile
        run: |
          pnpm --filter @pace/api typecheck
          pnpm --filter @pace/mobile typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit and integration tests (packages, mobile logic)
        run: pnpm test:unit --ci
      - name: API end-to-end tests (PGlite)
        run: pnpm test:api
      - name: Bundle iOS JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/pace-bundle
