# Signs in through the app's real sign-in screen. The UI preview build points at the local auth
# stand-in (scripts/ui-preview/auth-stub.mjs), which accepts only this test account.
appId: app.pace.ios
env:
  PREVIEW_EMAIL: preview@pace.test
  PREVIEW_PASSWORD: preview-password-1
---
- extendedWaitUntil: { visible: 'Create account', timeout: 120000 }
- tapOn: 'Sign in'
- extendedWaitUntil: { visible: 'Forgot password\?', timeout: 20000 }
# Each label text appears twice in the accessibility tree before its field, so the field is the
# third match. Wait for the keyboard before typing: characters typed earlier are lost.
- tapOn: { text: 'Email', index: 2 }
- waitForAnimationToEnd
- inputText: ${PREVIEW_EMAIL}
- tapOn: { text: 'Password', index: 2 }
- waitForAnimationToEnd
- inputText: ${PREVIEW_PASSWORD}
- pressKey: Enter
- extendedWaitUntil: { visible: 'STEP 1 OF 4', timeout: 30000 }
