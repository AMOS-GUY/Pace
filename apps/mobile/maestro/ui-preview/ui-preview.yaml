# UI preview (CI only, .github/workflows/ui-preview.yml): walks the real Release build on an iOS
# simulator and takes a screenshot of every screen it can reach. It changes nothing in the app.
#
# The CI build has no Supabase settings, so the app starts on "PACE is not configured". The
# auth screens and onboarding are opened through the app's own pace:// deep links. Finishing
# onboarding opens the tabs (existing behaviour of an unconfigured build). Activity data comes
# from a real recording, driven by simulated GPS movement (Maestro `travel`).
#
# Almost every step is optional, so one missing label never stops the walk: the screenshots show
# what was really reached.
appId: app.pace.ios
---
- launchApp:
    clearState: true
    permissions:
      location: allow
- extendedWaitUntil:
    visible: 'PACE is not configured'
    timeout: 120000
    optional: true
- takeScreenshot: 01-not-configured

# ---------------------------------------------------------------- authentication screens
- openLink: pace://welcome
- tapOn: { text: 'Open', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 02-auth-welcome
- tapOn: { text: 'Create account', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 03-auth-sign-up
- openLink: pace://sign-in
- waitForAnimationToEnd
- takeScreenshot: 04-auth-sign-in
- openLink: pace://forgot-password
- waitForAnimationToEnd
- takeScreenshot: 05-auth-forgot-password

# ---------------------------------------------------------------- onboarding
- openLink: pace://sports
- waitForAnimationToEnd
- takeScreenshot: 06-onboarding-sports
- tapOn: { text: 'Run', optional: true }
- tapOn: { text: 'Ride', optional: true }
- takeScreenshot: 07-onboarding-sports-selected
- tapOn: { text: 'Continue', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 08-onboarding-units
- tapOn: { text: 'Metric (km, m)', optional: true }
- tapOn: { text: 'Continue', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 09-onboarding-permissions
- tapOn: { text: 'Not now', optional: true }
- tapOn: { text: 'Finish', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 10-home-empty

# ---------------------------------------------------------------- tabs before any activity
- tapOn: { text: 'Activities', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 11-activities-empty
- tapOn: { text: 'Progress', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 12-progress-empty
- tapOn: { text: 'Profile', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 13-profile
- scroll
- takeScreenshot: 14-profile-scrolled

# ---------------------------------------------------------------- a real recording (simulated GPS)
- setLocation:
    latitude: 47.3769
    longitude: 8.5417
- tapOn: { text: 'Record', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 15-record
- tapOn: { text: 'Start Run', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 16-recording-setup
- tapOn: { text: 'Find GPS', optional: true }
- tapOn: { text: 'Allow While Using App', optional: true }
- tapOn: { text: 'Change to Always Allow', optional: true }
- extendedWaitUntil:
    visible: 'Start'
    timeout: 30000
    optional: true
- takeScreenshot: 17-recording-gps
- tapOn: { text: 'Start', optional: true }
- tapOn: { text: 'Start without a fix', optional: true }
- travel:
    points:
      - 47.3769,8.5417
      - 47.3778,8.5428
      - 47.3787,8.5439
      - 47.3796,8.5450
      - 47.3805,8.5461
    speed: 6
- takeScreenshot: 18-recording-live
- tapOn: { id: 'Pause recording', optional: true }
- tapOn: { text: 'Pause recording', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 19-recording-paused
- tapOn: { text: 'Finish', optional: true }
- tapOn: { text: 'Finish & save', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 20-recording-summary
- tapOn: { text: 'View activity', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 21-activity-detail
- scroll
- takeScreenshot: 22-activity-detail-scrolled
- scroll
- takeScreenshot: 23-activity-detail-scrolled-more

# ---------------------------------------------------------------- tabs with one activity
- openLink: pace:///
- waitForAnimationToEnd
- tapOn: { text: 'Home', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 24-home-with-activity
- tapOn: { text: 'Activities', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 25-activities-with-activity
- tapOn: { text: 'Progress', optional: true }
- waitForAnimationToEnd
- takeScreenshot: 26-progress-with-activity

# ---------------------------------------------------------------- other screens
- openLink: pace://import
- waitForAnimationToEnd
- takeScreenshot: 27-import
- openLink: pace://settings/units
- waitForAnimationToEnd
- takeScreenshot: 28-settings-units
- openLink: pace://settings/goals
- waitForAnimationToEnd
- takeScreenshot: 29-settings-goals
- openLink: pace://settings/privacy
- waitForAnimationToEnd
- takeScreenshot: 30-settings-privacy
- openLink: pace://settings/devices
- waitForAnimationToEnd
- takeScreenshot: 31-settings-devices
- openLink: pace://settings/export
- waitForAnimationToEnd
- takeScreenshot: 32-settings-export
- openLink: pace://settings/backup
- waitForAnimationToEnd
- takeScreenshot: 33-settings-backup
- openLink: pace://settings/account
- waitForAnimationToEnd
- takeScreenshot: 34-settings-account
