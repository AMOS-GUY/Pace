- waitForAnimationToEnd
- takeScreenshot: 31-settings-devices
- runFlow: { file: open-link.yaml, env: { LINK: 'pace://settings/export' } }
- waitForAnimationToEnd
- takeScreenshot: 32-settings-export
- runFlow: { file: open-link.yaml, env: { LINK: 'pace://settings/backup' } }
